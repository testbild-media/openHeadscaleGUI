{{define "content"}}
<div class="head"><div><h1>Passwort ändern</h1>
  {{if .User.MustChangePassword}}<div class="sub warn-t">Bitte vergib vor dem Fortfahren ein neues Passwort.</div>{{end}}</div></div>
<form method="post" action="/profile/password" class="card" autocomplete="off">
  {{template "csrf" .CSRF}}
  <div class="field"><label>Aktuelles Passwort</label><input type="password" name="current" required autocomplete="current-password" maxlength="256"></div>
  <div class="row2">
    <div class="field"><label>Neues Passwort</label><input type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password">
      <div class="help">Mind. 12 Zeichen und 3 Zeichenarten – oder eine Passphrase ab 20 Zeichen.</div></div>
    <div class="field"><label>Wiederholen</label><input type="password" name="password2" required minlength="12" maxlength="256" autocomplete="new-password"></div>
  </div>
  <button class="btn primary" type="submit">Passwort ändern</button>
</form>
{{end}}
