name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            OUT="dist/pkg-$ARCH"
            mkdir -p "$OUT/deploy"
            CGO_ENABLED=0 GOOS=linux GOARCH=$ARCH go build -trimpath \
              -ldflags "-s -w -X github.com/testbild-media/openHeadscaleGUI/internal/app.Version=$VERSION" \
              -o "$OUT/ohg" ./cmd/ohg
            cp README.md THIRD_PARTY_NOTICES.md "$OUT/"
            cp deploy/ohg.service deploy/ohg.env.example "$OUT/deploy/"
            tar -C "$OUT" -czf "dist/ohg_linux_$ARCH.tar.gz" .
          done
          cp install.sh dist/install.sh
          (cd dist && sha256sum ohg_linux_*.tar.gz install.sh > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ohg_linux_amd64.tar.gz
            dist/ohg_linux_arm64.tar.gz
            dist/install.sh
            dist/checksums.txt
