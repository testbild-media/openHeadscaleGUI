name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build (linux/amd64, linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/ohg-amd64 ./cmd/ohg
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/ohg-arm64 ./cmd/ohg
      - name: Shellcheck install.sh
        run: shellcheck -s sh install.sh || true
